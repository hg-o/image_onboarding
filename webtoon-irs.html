document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ing:7px 10px 7px 14px;border-radius:8px;font-size:14px\" style-hover=\"{background:'#262829',color:'#fff',textDecoration:'none'}\"><span style=\"color:#55595e\">└<\u002Fspan>신규 스토리 생성<\u002Fa>\n      <a href=\"story-edit.html\" style=\"display:flex;align-items:center;gap:8px;color:#d5d7da;padding:7px 10px 7px 14px;border-radius:8px;font-size:14px\" style-hover=\"{background:'#262829',color:'#fff',textDecoration:'none'}\"><span style=\"color:#55595e\">└<\u002Fspan>기존 스토리 수정<\u002Fa>\n      <div style=\"padding:12px 10px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8b9096\">IMAGE<\u002Fdiv>\n      <span style=\"display:flex;align-items:center;gap:8px;color:#fff;background:#262829;padding:7px 10px 7px 14px;border-radius:8px;font-size:14px;font-weight:600\"><span style=\"color:#22e05f\">└<\u002Fspan>Webtoon IRS<\u002Fspan>\n      <a href=\"index.html\" style=\"display:flex;align-items:center;gap:8px;color:#d5d7da;padding:7px 10px 7px 14px;border-radius:8px;font-size:14px\" style-hover=\"{background:'#262829',color:'#fff',textDecoration:'none'}\"><span style=\"color:#55595e\">└<\u002Fspan>Webtoon IRS 가이드<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:#2a2d2e;margin:0 4px\"><\u002Fdiv>\n    <div style=\"padding:0 10px;font-size:12px;font-weight:700;color:#6f7378\">이 페이지<\u002Fdiv>\n    <div id=\"navlinks\" style=\"display:flex;flex-direction:column;gap:2px\">\n      <a href=\"#intro\" style=\"color:#d5d7da;padding:8px 10px;border-radius:8px;font-size:14px\" style-hover=\"{background:'#262829',color:'#fff',textDecoration:'none'}\">IRS란<\u002Fa>\n      <a href=\"#version\" style=\"color:#d5d7da;padding:8px 10px;border-radius:8px;font-size:14px\" style-hover=\"{background:'#262829',color:'#fff',textDecoration:'none'}\">버전 · 권한<\u002Fa>\n      <a href=\"#how\" style=\"color:#d5d7da;padding:8px 10px;border-radius:8px;font-size:14px\" style-hover=\"{background:'#262829',color:'#fff',textDecoration:'none'}\">IRS의 작동 원리<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"display:grid;gap:64px;max-width:780px;min-width:0\">\n\n    <header id=\"intro\" style=\"display:grid;gap:16px;scroll-margin-top:24px\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#0a9a44\">BYUS 콘텐츠 팀 · 온보딩<\u002Fspan>\n      <h1 style=\"margin:0;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:pretty\">Webtoon IRS<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.65;color:#444;text-wrap:pretty\"><b style=\"color:#161718\">IRS(Image Retrieval Service)<\u002Fb> : byUs 서비스 안에서 자동생성되는 이미지를 위한 원본 자료들을 작업하고 저장해놓는 도구입니다.<\u002Fp>\n      <img src=\"79ba0e2c-3168-420e-b2ca-6b0106b01f08\" alt=\"Webtoon IRS 홈 화면\" style=\"width:100%;height:auto;display:block;border-radius:10px;border:1px solid #e3e5e8;margin-top:8px\">\n    <\u002Fheader>\n\n    <section id=\"version\" style=\"display:grid;gap:20px;scroll-margin-top:24px\">\n      <h2 style=\"margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em\">버전<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#444\">IRS는 Dev 버전과 Prod (Real) 서버 버전이 따로 있습니다.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n        <a href=\"https://dev-image-retrieval.io.naver.com/\" target=\"_blank\" style=\"display:grid;gap:8px;background:#fff;border:1px solid #e3e5e8;border-radius:12px;padding:18px;text-decoration:none;color:inherit\" style-hover=\"{borderColor:'#22e05f'}\">\n          <span style=\"display:inline-flex;width:fit-content;font-size:11px;font-weight:700;letter-spacing:.06em;color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:3px 9px\">DEV<\u002Fspan>\n          <span style=\"font-size:14px;color:#0a9a44;word-break:break-all\">dev-image-retrieval.io.naver.com<\u002Fspan>\n          <ul style=\"margin:4px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.55;color:#444;text-wrap:pretty\">\n            <li>개발자가 사용하는 환경입니다. 일반 사용자는 접속할 수 없습니다.<\u002Fli>\n            <li>일반 사용자에게는 공개되면 안 되는 단계의 테스트 작업을 할 때 활용합니다.<\u002Fli>\n          <\u002Ful>\n        <\u002Fa>\n        <a href=\"https://irs.navercorp.com/\" target=\"_blank\" style=\"display:grid;gap:8px;background:#fff;border:1px solid #e3e5e8;border-radius:12px;padding:18px;text-decoration:none;color:inherit\" style-hover=\"{borderColor:'#22e05f'}\">\n          <span style=\"display:inline-flex;width:fit-content;font-size:11px;font-weight:700;letter-spacing:.06em;color:#0a7a37;background:#dcfce7;border-radius:999px;padding:3px 9px\">REAL<\u002Fspan>\n          <span style=\"font-size:14px;color:#0a9a44;word-break:break-all\">irs.navercorp.com<\u002Fspan>\n          <ul style=\"margin:4px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.55;color:#444;text-wrap:pretty\">\n            <li>일반 사용자에게 공개되는 실제 서비스 환경입니다.<\u002Fli>\n            <li>모든 사람들에게 공개되는 페이지이기 때문에 신중하게 세팅해야합니다.<\u002Fli>\n          <\u002Ful>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e3e5e8;border-radius:12px;padding:20px;display:grid;gap:14px\">\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#222;text-wrap:pretty\"><b>Real 서버용 IRS는 권한을 받아야 사용할 수 있습니다.<\u002Fb><br>링크로 접속하여 권한을 받은 후 <b>'오승근'<\u002Fb>님께 슬랙으로 알려주세요.<\u002Fp>\n        <div style=\"display:grid;gap:8px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n            <span style=\"font-size:13px;font-weight:700;color:#6b7075\">슬랙 메시지 예시<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copyMsg }}\" style=\"font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid #d9dcdf;background:#fff;color:#161718;cursor:pointer\" style-hover=\"{background:'#f3f4f5'}\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:0;background:#f5f6f7;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.7;color:#333;white-space:pre-wrap;text-wrap:pretty\">승근님 안녕하세요? byUs 콘텐츠 팀에 금일 인턴으로 입사한 ㅇㅇㅇ입니다, 앞으로 잘 부탁드립니다!\n업무를 위하여 IRS 권한을 요청드려서 승인을 부탁드리고자 메시지 드립니다 ☺️<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"how\" style=\"display:grid;gap:20px;scroll-margin-top:24px\">\n      <h2 style=\"margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em\">IRS의 작동 원리<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#444;text-wrap:pretty\">콘텐츠 담당자가 IRS에 쌓아둔 작화와 태그를, byUs의 AI가 사용자의 요청에 맞춰 참고 자료로 불러와 이미지를 생성합니다.<\u002Fp>\n\n      <div style=\"display:grid;gap:16px\">\n        <div style=\"background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:20px;display:grid;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:#0a7a37;background:#dcfce7;border-radius:999px;padding:3px 9px\">IRS<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;color:#6b7075\">콘텐츠 담당자가 준비하는 단계<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n            <div style=\"display:grid;gap:8px;background:#f5f6f7;border-radius:12px;padding:16px\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">1<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#0a7a37\">콘텐츠 담당자<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.5;color:#222;text-wrap:pretty\">작품별/캐릭터별로 원작 작화 저장<\u002Fp>\n              <img src=\"163837d7-9644-4830-b40f-fc41ac723d6a\" alt=\"IRS Import Images 화면: 작품 에피소드에서 원작 작화를 선택해 가져오기\" loading=\"lazy\" style=\"width:100%;height:auto;display:block;border-radius:10px;border:1px solid #e3e5e8;margin-top:4px\">\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:8px;background:#f5f6f7;border-radius:12px;padding:16px\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">2<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#0a7a37\">콘텐츠 담당자<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.5;color:#222;text-wrap:pretty\">저장된 작화에 태그 붙이기<\u002Fp>\n              <img src=\"6041c54f-af47-482b-9e3d-fb23d04c7664\" alt=\"IRS Edit Image Tags 화면: 장소, 감정, 동작, 카메라 구도 등 태그 입력\" loading=\"lazy\" style=\"width:100%;height:auto;display:block;border-radius:10px;border:1px solid #e3e5e8;margin-top:4px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:center;color:#9aa0a6;font-size:20px;line-height:1\">↓<\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:20px;display:grid;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:3px 9px\">BYUS<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;color:#6b7075\">사용자가 이미지화할 글을 쓰는 단계<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n            <div style=\"display:grid;gap:8px;background:#f5f6f7;border-radius:12px;padding:16px\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"flex:none;border-radius:6px;background:#161718;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px\">Snapshot<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#2563eb\">사용자<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.5;color:#222;text-wrap:pretty\">채팅 생성하기<\u002Fp>\n              <img src=\"1aca67b2-d133-4929-8920-a1b001ebad9a\" alt=\"byUs 채팅 화면: 사용자와 캐릭터가 대화를 주고받는 모습\" loading=\"lazy\" style=\"width:100%;height:auto;display:block;border-radius:10px;border:1px solid #e3e5e8;margin-top:4px\">\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:8px;background:#f5f6f7;border-radius:12px;padding:16px\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"flex:none;border-radius:6px;background:#161718;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px\">Cover<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#2563eb\">사용자<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.5;color:#222;text-wrap:pretty\">UGC 제목과 시나리오 작성<\u002Fp>\n              <img src=\"eab08057-d541-4db3-a522-73359da0eb36\" alt=\"byUs 스토리 만들기 화면: 제목과 시나리오 입력\" loading=\"lazy\" style=\"width:100%;height:auto;display:block;border-radius:10px;border:1px solid #e3e5e8;margin-top:4px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:center;color:#9aa0a6;font-size:20px;line-height:1\">↓<\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:20px;display:grid;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:#b45309;background:#fef3c7;border-radius:999px;padding:3px 9px\">BYK<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;color:#6b7075\">사용자가 쓴 텍스트나 채팅을 AI가 이미지로 만드는 단계<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:10px\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"flex:none;border-radius:6px;background:#161718;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px\">Snapshot<\u002Fspan><span style=\"font-size:14px;font-weight:600;color:#222\">대화의 가장 마지막 장면을 이미지로 생성<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;gap:8px\">\n              <div style=\"display:flex;align-items:flex-start;gap:10px;background:#f5f6f7;border-radius:12px;padding:12px 14px\">\n                <span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">1<\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:13px;font-weight:700;color:#b45309;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all\">INPUT_SAFETY_CHECK<\u002Fspan>\n                  <p style=\"margin:0;font-size:14px;line-height:1.5;color:#222;text-wrap:pretty\">이미지로 만들 채팅 내용을 텍스트로 보았을 때의 안정성을 검사하는 단계<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:10px;background:#f5f6f7;border-radius:12px;padding:12px 14px\">\n                <span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">2<\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:13px;font-weight:700;color:#b45309;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all\">CHARACTER_EXTRACTION<\u002Fspan>\n                  <p style=\"margin:0;font-size:14px;line-height:1.5;color:#222;text-wrap:pretty\">이미지에 등장할 캐릭터를 고르는 단계<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:10px;background:#f5f6f7;border-radius:12px;padding:12px 14px\">\n                <span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">3<\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:13px;font-weight:700;color:#b45309;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all\">SNAPSHOT_CONTINUITY<\u002Fspan>\n                  <p style=\"margin:0;font-size:14px;line-height:1.5;color:#222;text-wrap:pretty\">이전 대화와 연속성이 있는 이미지가 나오도록 하는 단계<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:10px;background:#f5f6f7;border-radius:12px;padding:12px 14px\">\n                <span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">4<\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:13px;font-weight:700;color:#b45309;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all\">SNAPSHOT_ENHANCE<\u002Fspan>\n                  <p style=\"margin:0;font-size:14px;line-height:1.5;color:#222;text-wrap:pretty\">AI가 더 잘 알아들을 수 있는 방향으로 프롬프트를 정제하는 단계<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:10px;background:#f5f6f7;border-radius:12px;padding:12px 14px\">\n                <span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#161718;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">
